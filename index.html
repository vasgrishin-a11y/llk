<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ежемесячный цикл интегрированного бизнес-планирования</title>
<meta name="description" content="Дашборд: обзор, сегментация, спрос, запасы, поставки, планы и действия">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- SheetJS вендорен локально: дашборд работает без доступа к CDN -->
<script src="assets/xlsx.full.min.js"></script>
<style>
/* ═══════════════ ТОКЕНЫ In.Plan (гайдлайн октября 2026: Manrope · #4769ff · #04143a · #f4f6fa) ═══════════════ */
:root{
  --scp-font:'Manrope',Arial,sans-serif;
  --scp-n-0:#ffffff;--scp-n-50:#f4f6fa;--scp-n-100:#eaedf5;--scp-n-150:#dfe5f0;
  --scp-n-200:#d2dae8;--scp-n-300:#bcc6d9;--scp-n-500:#a1a9b7;--scp-n-600:#6c7891;
  --scp-n-700:#475573;--scp-n-800:#1c2145;--scp-n-900:#04143a;--scp-n-950:#020b22;
  /* фирменный синий и бренд-палитра In.Plan */
  --scp-b-50:#eef2ff;--scp-b-100:#e0e8ff;--scp-b-200:#c7d5ff;--scp-b-300:#9db7ff;
  --scp-b-400:#88c7ff;--scp-b-500:#5e81ff;--scp-b-600:#4769ff;--scp-b-700:#1451ff;
  --scp-b-800:#1b1b63;--scp-b-900:#0a0a53;--scp-b-950:#04143a;
  --scp-accent:#4769ff;--scp-accent-hover:#1451ff;--scp-accent-active:#0e3fd1;
  --scp-accent-sub:#4769ff;--scp-accent-2:#88c7ff;--scp-accent-bd:#c7d5ff;--scp-accent-bg:#e3ebff;
  --scp-plum:#a5246c;--scp-violet:#4528c3;--scp-teal:#00576a;--scp-magenta:#ed0084;
  --scp-grad-brand:linear-gradient(90deg,#4769ff 0%,#704bf9 38%,#e52b8a 72%,#f37635 100%);
  /* поверхности */
  --scp-bg:#f4f6fa;--scp-surface:#ffffff;--scp-surface-2:#f8f9fc;
  --scp-rail:#04143a;--scp-rail-2:#0e2c5e;--scp-rail-hover:#0b2154;
  /* текст */
  --scp-text:#04143a;--scp-text-2:#2c3b59;--scp-text-3:#687692;
  /* границы */
  --scp-line:#e6ebf4;--scp-line-2:#dae2ef;--scp-divider:#c5cfdf;--scp-ctrl:#a1a9b7;
  --scp-ctrl-hover:#475573;--scp-menu-bd:#cdd6e6;
  /* семантика */
  --scp-ok:#0d9f6e;--scp-ok-bg:#dff6ee;--scp-ok-tx:#08744f;
  --scp-err:#ff0017;--scp-err-tx:#d10013;--scp-err-bg:#ffe5e8;
  --scp-warn:#ff8c00;--scp-warn-bg:#fff1dc;--scp-warn-tx:#b85c00;
  --r-s:6px;--r-m:12px;--r-l:18px;
  /* алиасы для canvas-движка (charts.js читает их из :root) */
  --bg:var(--scp-bg);--card:var(--scp-surface);--text:var(--scp-text);
  --muted:var(--scp-text-3);--line:var(--scp-line-2);--accent:var(--scp-accent);
  --good:var(--scp-ok-tx);--warn:var(--scp-warn-tx);--bad:var(--scp-err);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--scp-bg);color:var(--scp-text);
  font:400 14px/20px var(--scp-font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.muted{color:var(--scp-text-3)}
button{font:inherit;cursor:pointer}

/* ═══════════════ КАРКАС: фирменный топбар In.Plan (#04143a) + горизонтальное меню ═══════════════ */
.app{display:flex;flex-direction:column;min-height:100vh}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
/* Единая верхняя полоса: векторный логотип In.Plan + разделы + быстрые действия */
.topbar{background:var(--scp-rail);display:flex;align-items:stretch;gap:0;padding:0 24px;min-height:60px;
  position:sticky;top:0;z-index:320;border-bottom:1px solid rgba(71,105,255,.22);
  box-shadow:0 4px 20px rgba(4,20,58,.18)}
.brand{display:flex;align-items:center;flex:0 0 auto;padding:12px 22px 12px 4px;margin-right:16px;
  position:relative;text-decoration:none;transition:opacity .15s}
.brand:hover{opacity:.92}
.brand::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:1px;height:26px;background:rgba(161,169,183,.24)}
.brand-logo{height:22px;width:auto;display:block;flex:0 0 auto}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto;padding-left:16px}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;
  background:rgba(255,255,255,.03);border:1px solid rgba(161,169,183,.28);color:#cdd5e6;cursor:pointer;transition:.14s;position:relative}
.tb-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb-btn:hover{border-color:var(--scp-accent);color:#ffffff;background:rgba(71,105,255,.24)}
.tb-btn.d:hover{border-color:var(--scp-err);color:#ffffff;background:rgba(255,0,23,.24)}
.tb-btn[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;
  background:var(--scp-n-900);color:#ffffff;border:1px solid rgba(71,105,255,.32);font-size:12px;line-height:16px;
  white-space:nowrap;padding:6px 10px;border-radius:var(--r-s);opacity:0;pointer-events:none;
  box-shadow:0 8px 22px rgba(4,20,58,.28);transition:opacity .15s;z-index:500}
.tb-btn[data-tip]:hover::after{opacity:1}
/* ── Экспорт дашборда: кнопка + выпадающее меню форматов ── */
.tb-export{position:relative}
.tb-btn.busy{opacity:.45;pointer-events:none;animation:tbPulse 1.1s ease-in-out infinite}
@keyframes tbPulse{50%{opacity:.85}}
.tb-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:80;min-width:276px;background:var(--scp-surface);
  border:1px solid var(--scp-line-2);border-radius:14px;box-shadow:0 18px 44px rgba(4,20,58,.18);
  padding:8px;font-family:var(--scp-font)}
.tb-menu-t{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--scp-text-3);padding:8px 10px 7px}
.tb-menu-i{display:flex;gap:11px;align-items:center;width:100%;background:none;border:0;border-radius:9px;
  padding:9px 10px;cursor:pointer;text-align:left;font-family:inherit;transition:background .12s}
.tb-menu-i:hover{background:var(--scp-b-50)}
.mi-ic{font-size:19px;flex:0 0 auto}
.mi-tx b{display:block;font-size:13.5px;font-weight:700;color:var(--scp-text)}
.mi-tx small{display:block;font-size:11px;color:var(--scp-text-3);margin-top:2px}
/* Разделы — часть той же полосы */
.topnav{display:flex;align-items:stretch;gap:2px;min-width:0;overflow-x:auto;background:transparent}
.topnav::-webkit-scrollbar{height:0}
.topnav button{display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;
  border-bottom:3px solid transparent;color:#b8c3da;padding:0 15px 0;
  font:500 13px/18px var(--scp-font);cursor:pointer;transition:.15s;white-space:nowrap}
.topnav button b{font-weight:inherit}
.topnav button:hover{color:#ffffff;background:rgba(71,105,255,.12)}
.topnav button:hover .dot{background:var(--scp-accent-2)}
.topnav button.on{border-bottom-color:var(--scp-accent);color:#ffffff;font-weight:700;
  background:linear-gradient(180deg,rgba(71,105,255,.04),rgba(71,105,255,.24))}
.topnav .dot{width:6px;height:6px;border-radius:50%;background:#4a5a80;flex:0 0 6px;transition:.15s}
.topnav button.on .dot{background:var(--scp-accent);box-shadow:0 0 8px rgba(71,105,255,.85)}

/* ═══════════════ ШАПКА: заголовок раздела ═══════════════ */
header{background:var(--scp-surface);border-bottom:1px solid var(--scp-line-2);
  padding:16px 32px 14px;display:flex;align-items:flex-start;gap:16px}
.hdr-left{display:flex;align-items:flex-start;gap:12px;min-width:0}
h1{font:800 26px/32px var(--scp-font);letter-spacing:-.02em;margin:0;color:var(--scp-text)}
.h-sub{font-size:12.5px;line-height:17px;color:var(--scp-text-3);margin-top:3px}
.hdr-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:var(--r-s);
  color:var(--scp-text-2);cursor:pointer;transition:.12s;position:relative}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.icon-btn.d:hover{border-color:var(--scp-err);color:var(--scp-err-tx);background:var(--scp-err-bg)}
.icon-btn[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;
  transform:translateX(-50%);background:var(--scp-n-900);color:#ffffff;font-size:12px;line-height:16px;
  white-space:nowrap;padding:5px 9px;border-radius:var(--r-s);opacity:0;pointer-events:none;
  transition:opacity .15s;z-index:500}
.icon-btn[data-tip]:hover::after{opacity:1}

/* ═══════════════ Строка контекста ═══════════════ */
.ctxbar{background:var(--scp-surface);border-bottom:1px solid var(--scp-line-2);
  padding:8px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctx-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--scp-text-3);margin-right:2px}
.ctx-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;
  background:var(--scp-n-50);border:1px solid var(--scp-line-2);border-radius:9999px;
  font-size:12px;color:var(--scp-text-2);white-space:nowrap}
.ctx-chip b{color:var(--scp-text);font-weight:700}
.ctx-chip .cd{width:7px;height:7px;border-radius:50%;background:var(--scp-accent);flex:0 0 7px}

/* ═══════════════ Панель фильтра периодов (в разделах) ═══════════════ */
.periodbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 14px;
  background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  box-shadow:0 2px 8px rgba(4,20,58,.03)}
.periodbar .pb-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--scp-text-3)}
.periodbar .switch{margin:0}
.pb-custom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--scp-text-2);margin-left:auto;flex-wrap:wrap}
.pb-custom select{font:inherit;font-size:12px;font-weight:500;padding:5px 9px;border:1px solid var(--scp-line-2);border-radius:var(--r-s);
  background:var(--scp-n-50);color:var(--scp-text);cursor:pointer}
.pb-custom select:focus{outline:2px solid var(--scp-accent-bd);border-color:var(--scp-accent)}
.pb-summary{font-size:12px;color:var(--scp-text-3);margin-bottom:8px}
.pb-summary b{color:var(--scp-accent);font-weight:700}

/* ── Полоса рисков плана запасов: минималистичные бейджи с тултипом ── */
.risk-strip{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 10px;
  padding:8px 12px;background:var(--scp-surface-2);border:1px solid var(--scp-line-2);
  border-radius:var(--r-m)}
.risk-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--scp-text-3);margin-right:2px}
.risk-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:9999px;
  font-size:12px;font-weight:600;cursor:help;border:1.5px solid;white-space:nowrap;transition:background .12s}
.risk-over{color:var(--scp-warn-tx);border-color:var(--scp-warn);background:#fff7eb}
.risk-over:hover{background:var(--scp-warn-bg)}
.risk-under{color:#b80011;border-color:var(--scp-err);background:#fff2f4}
.risk-under:hover{background:var(--scp-err-bg)}
.risk-hint{color:var(--scp-b-800);border-color:var(--scp-accent);background:var(--scp-b-50)}
.risk-hint:hover{background:var(--scp-accent-bg)}
.risk-ok{font-size:12.5px;color:var(--scp-ok-tx);font-weight:600}

/* ═══════════════ Информационные тултипы у расчётных показателей ═══════════════ */
.infodot{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;
  border-radius:50%;background:var(--scp-b-50);color:var(--scp-accent);font-size:10px;font-weight:700;
  cursor:help;vertical-align:1px;user-select:none;border:1px solid var(--scp-accent-bd);transition:.12s}
.infodot:hover{background:var(--scp-accent);color:#ffffff;border-color:var(--scp-accent)}
.kpi-label .infodot{vertical-align:0}
#__chartTip{transition:opacity .08s}

/* ═══════════════ Контент, карточки, сетки ═══════════════ */
main{padding:20px 32px 72px;flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  padding:18px 20px 16px;margin-bottom:16px;min-width:0;position:relative;
  box-shadow:0 2px 10px rgba(4,20,58,.04)}
.card h2{font:700 15.5px/21px var(--scp-font);letter-spacing:-.01em;margin:0 0 4px;color:var(--scp-text);padding-right:34px}
.card-sub{margin-bottom:8px;font-size:12px}
.plan-chart-controls{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:4px 0 10px;padding:10px 12px;background:var(--scp-surface-2);border:1px solid var(--scp-line-2);border-radius:var(--r-s)}
.plan-chart-controls .control-label{font-size:11px;margin-bottom:3px;font-weight:700}
.plan-chart-controls .switch{margin:0}
/* ── Разворот графика на весь экран: маленькая кнопка в правом верхнем углу карточки ── */
.chart-expand{position:absolute;top:12px;right:14px;width:28px;height:28px;display:inline-flex;
  align-items:center;justify-content:center;background:var(--scp-surface);border:1px solid var(--scp-line-2);
  border-radius:var(--r-s);color:var(--scp-text-3);cursor:pointer;transition:.14s;padding:0;z-index:5}
.chart-expand svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chart-expand:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.card.fs{position:fixed;inset:14px;z-index:2000;overflow:auto;margin:0;
  box-shadow:0 24px 80px rgba(4,20,58,.36);border-color:var(--scp-accent-bd)}
.card.fs h2{padding-right:40px}
.card.fs .chart-expand{position:fixed;top:24px;right:26px;z-index:2005;
  box-shadow:0 2px 10px rgba(4,20,58,.16);width:30px;height:30px}
/* ── Пропорциональное увеличение: карточка сценария и панель «Выполнение бизнес-плана 2026» ── */
.zoomable{cursor:zoom-in}
.zoomable:hover .chart-expand{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.zoom-layer{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;
  padding:16px;pointer-events:none}
.zoom-stage{position:relative;flex:0 0 auto;pointer-events:auto;animation:zoomPop .22s cubic-bezier(.2,.85,.3,1)}
@keyframes zoomPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.zoom-win{position:absolute;inset:0;overflow:hidden;background:var(--scp-surface);border-radius:var(--r-m);
  box-shadow:0 30px 90px rgba(4,20,58,.42),0 0 0 1px var(--scp-accent-bd)}
.zoom-fit{position:relative}
.zoom-scale{transform-origin:0 0}
.zoom-scale>.scen,.zoom-scale>.scen-year{margin:0}
.zoom-scale>.scen:hover{transform:none}
.zoom-close{position:absolute;top:-13px;right:-13px;z-index:3;width:30px;height:30px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;
  background:var(--scp-surface);border:1px solid var(--scp-line-2);color:var(--scp-text-2);
  box-shadow:0 6px 18px rgba(4,20,58,.28);transition:.14s}
.zoom-close svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.zoom-close:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50);transform:rotate(90deg)}
.zoom-hint{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);display:flex;
  pointer-events:none;align-items:center;gap:7px;white-space:nowrap;padding:5px 13px;border-radius:9999px;
  background:rgba(4,20,58,.92);color:#eef2ff;font-size:11.5px;line-height:16px;box-shadow:0 6px 18px rgba(4,20,58,.3)}
.zoom-hint .zoom-k{color:var(--scp-accent-2);font-size:12px;font-variant-numeric:tabular-nums}
@media (max-height:660px){.zoom-hint{display:none}}
@media (prefers-reduced-motion:reduce){.zoom-stage{animation:none}}
body.fs-lock{overflow:hidden}
.fs-backdrop{position:fixed;inset:0;z-index:1990;background:rgba(4,20,58,.56);backdrop-filter:blur(3px)}
.section-h{margin:12px 0 12px;font:700 12.5px/18px var(--scp-font);color:var(--scp-accent);
  text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--scp-line-2);padding-bottom:7px}
canvas.chart{width:100%;display:block;margin-top:8px;cursor:pointer}

/* ── Инсайты и информационные полосы ── */
.insight{margin-top:10px;padding:10px 14px;background:var(--scp-b-50);
  border-left:4px solid var(--scp-accent);border-radius:var(--r-s);
  font-size:12.5px;line-height:1.55;color:var(--scp-text-2)}
.insight b,.info b{color:var(--scp-text);font-weight:700}
.info{padding:10px 14px;border-radius:var(--r-s);margin:10px 0;font-size:12.5px;line-height:1.55;
  border:1px solid var(--scp-line-2);color:var(--scp-text-2);background:var(--scp-surface)}
.info-danger{background:#fff6f7;border-color:#ffd4d9;border-left:4px solid var(--scp-err)}
.info-warning{background:#fffaf2;border-color:#ffe4be;border-left:4px solid var(--scp-warn)}
.info-success{background:#f2fbf7;border-color:#c8eedd;border-left:4px solid var(--scp-ok)}
.info-primary{background:var(--scp-b-50);border-color:var(--scp-accent-bd);border-left:4px solid var(--scp-accent)}
.notice{padding:12px 14px;border-left:4px solid var(--scp-warn);background:#fffaf2;
  border-radius:var(--r-s);font-size:13px;line-height:1.6}
.decision{margin-top:16px}

/* ── KPI-карточки: заголовок · значение · подпись · дельта ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;
  margin:14px 0 16px;align-items:stretch}
.kpi{background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  padding:14px 16px 12px;display:flex;flex-direction:column;position:relative;
  box-shadow:0 2px 8px rgba(4,20,58,.035)}
.kpi-label{font-size:12.5px;line-height:17px;font-weight:600;color:var(--scp-text-2);min-height:34px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kpi .value{font:700 26px/32px var(--scp-font);color:var(--scp-text);margin-top:6px;
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.kpi .value.green{color:var(--scp-ok)}.kpi .value.orange{color:#e07800}
.kpi .value.red{color:var(--scp-err-tx)}.kpi .value.blue{color:var(--scp-accent)}
.kpi-sub{font-size:12px;line-height:16px;color:var(--scp-text-3);margin-top:3px;min-height:16px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;white-space:normal}
.kpi-foot{font-size:10.5px;margin-top:5px;color:var(--scp-text-3)}
.kpi-foot.red{color:var(--scp-err-tx)}.kpi-foot.orange{color:var(--scp-warn-tx)}
.kpi-foot.green{color:var(--scp-ok-tx)}
.kpi.bt-red{box-shadow:inset 0 3px 0 0 var(--scp-err),0 2px 8px rgba(4,20,58,.035)}
.kpi.bt-orange{box-shadow:inset 0 3px 0 0 var(--scp-warn),0 2px 8px rgba(4,20,58,.035)}
.kpi.bt-green{box-shadow:inset 0 3px 0 0 var(--scp-ok),0 2px 8px rgba(4,20,58,.035)}
.dev{align-self:flex-start;margin-top:7px;padding:2px 9px;border-radius:9999px;
  font-size:10.5px;font-weight:700}
.dev-neg{color:var(--scp-err-tx);background:var(--scp-err-bg)}
.dev-pos{color:var(--scp-ok-tx);background:var(--scp-ok-bg)}
.dev-neu{color:var(--scp-warn-tx);background:var(--scp-warn-bg)}
.kpi .tooltip{display:none;position:absolute;top:10px;right:10px;z-index:30;
  background:var(--scp-n-900);color:#ffffff;border:1px solid rgba(71,105,255,.32);padding:8px 11px;border-radius:var(--r-s);
  font-size:11px;line-height:15px;font-weight:400;max-width:260px;white-space:normal;
  box-shadow:0 8px 22px rgba(4,20,58,.28);pointer-events:none}
.kpi:hover .tooltip{display:block}

/* ── Переключатели (чипы In.Plan) ── */
.switch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.switch button{background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:9999px;
  padding:5px 14px;font:500 12.5px var(--scp-font);color:var(--scp-text-2);
  white-space:nowrap;transition:.14s}
.switch button:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.switch button.active{background:var(--scp-accent);color:#ffffff;border-color:var(--scp-accent);font-weight:700;
  box-shadow:0 2px 8px rgba(71,105,255,.26)}

/* ── Таблицы ── */
.toggle{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:var(--scp-n-50);
  color:var(--scp-text-2);border:1px solid var(--scp-line-2);border-radius:var(--r-s);
  padding:6px 12px;font:600 12.5px var(--scp-font);transition:.14s}
.toggle:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.tbl-wrap{display:none;margin-top:8px;max-height:360px;overflow:auto;
  border:1px solid var(--scp-line-2);border-radius:var(--r-s)}
.tbl-wrap.show{display:block}
.tbl-wrap.dev-wrap{max-height:none}
.tbl-scroll{overflow:auto;border:1px solid var(--scp-line-2);border-radius:var(--r-s);margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--scp-line)}
tbody tr:hover{background:var(--scp-b-50)}
table.dense{font-size:11.5px;font-variant-numeric:tabular-nums}
table.dense th{position:sticky;top:0;background:var(--scp-n-50);z-index:2;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--scp-text-3);font-weight:700}
table.dense td{padding:7px 9px;line-height:16px}
tr.row-sum td{background:var(--scp-b-50);font-weight:700;border-top:2px solid var(--scp-accent-bd)}
tr.row-fc td{background:#f6f8fd}
tr.row-total td{background:var(--scp-ok-bg);font-weight:700}
tr.dead td{background:#fff0f2;color:var(--scp-err-tx);font-weight:600}

/* ── Пузырьковая карта сегментации ── */
.bubblemap{position:relative;height:400px;border:1px solid var(--scp-line-2);
  border-radius:var(--r-m);margin-top:8px;overflow:hidden;background:var(--scp-surface-2)}
.zone{position:absolute;border:2px dashed;border-radius:var(--r-m);padding:7px 10px;
  font-size:11px;font-weight:700}
.zone-strategic{border-color:var(--scp-ok);color:var(--scp-ok-tx);background:rgba(13,159,110,.06);top:16px;left:16px;width:45%;height:46%}
.zone-core{border-color:var(--scp-accent);color:var(--scp-b-900);background:rgba(71,105,255,.06);top:16px;right:16px;width:45%;height:46%}
.zone-perspective{border-color:var(--scp-warn);color:var(--scp-warn-tx);background:rgba(255,140,0,.06);bottom:16px;left:16px;width:45%;height:46%}
.zone-transactional{border-color:var(--scp-err);color:var(--scp-err-tx);background:rgba(255,0,23,.06);bottom:16px;right:16px;width:45%;height:46%}
.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:9px;font-weight:700;color:#ffffff;cursor:default;
  transition:transform .2s;box-shadow:0 2px 6px rgba(4,20,58,.18);line-height:1.25;padding:2px}
.bubble:hover{transform:scale(1.1);z-index:10}
.bubble-strategic{background:var(--scp-ok)}.bubble-core{background:var(--scp-accent)}
.bubble-perspective{background:var(--scp-warn)}.bubble-transactional{background:var(--scp-err)}
.bubble-outlier{background:var(--scp-plum);border:3px solid var(--scp-warn)}

/* ── Матрица сегментации: горизонтальные полосы-сегменты ── */
.segbands{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sm-band{display:flex;align-items:stretch;border:1px solid var(--scp-line-2);border-left:5px solid var(--sc);
  border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 7%,#ffffff),#ffffff 55%);overflow:hidden}
.sm-band-off{opacity:.45}
.sm-band-head{flex:0 0 200px;display:flex;align-items:center;gap:10px;padding:16px 14px;
  border-right:1px dashed var(--scp-line-2);box-sizing:border-box}
.sm-band-chip{width:14px;height:14px;border-radius:50%;background:var(--sc);flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 18%,transparent)}
.sm-band-t{font-size:15px;font-weight:700;color:var(--scp-text);line-height:1.25}
.sm-band-meta{display:block;font-size:11px;font-weight:600;color:var(--scp-text-3);margin-top:3px;line-height:1.4}
.sm-band-plot{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;min-height:140px}
.sm-band-hidden{font-size:12px;color:var(--scp-text-3)}
.sm-dot{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;line-height:1.12;cursor:pointer;color:#ffffff;font-weight:700;padding:2px;box-sizing:border-box;
  box-shadow:0 3px 10px rgba(4,20,58,.16);transition:transform .15s,box-shadow .15s;flex:0 0 auto;overflow:hidden}
.sm-dot:hover{transform:scale(1.09);box-shadow:0 6px 20px rgba(4,20,58,.28);z-index:20}
.sm-dot.dim{opacity:.2}
/* «На пересмотр»: красная рамка — кандидат на понижение, зелёная — на повышение */
.sm-dot.sm-rev-down{box-shadow:0 0 0 3px #ffffff,0 0 0 5px var(--scp-err),0 3px 10px rgba(4,20,58,.16)}
.sm-dot.sm-rev-up{box-shadow:0 0 0 3px #ffffff,0 0 0 5px var(--scp-ok-tx),0 3px 10px rgba(4,20,58,.16)}
.sm-dot-n{display:block;padding:0 3px;word-break:break-word}
.sm-dot-v{display:block;opacity:.88;font-weight:600}
.sm-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:12px;color:var(--scp-text-2)}
.sm-legend button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:inherit;cursor:pointer;padding:3px 6px;border-radius:5px;font-size:12px;font-weight:600}
.sm-legend button:hover{background:var(--scp-b-50)}
.sm-legend button.off{opacity:.4;text-decoration:line-through}
.sm-legend i{width:13px;height:13px;border-radius:50%;display:inline-block}
@media (max-width:820px){.sm-band{flex-direction:column}.sm-band-head{flex:0 0 auto;border-right:0;border-bottom:1px dashed var(--scp-line-2)}}

/* ── Интерактивная схема-граф цепочки поставок ── */
.chaingraph{position:relative;border:1px solid var(--scp-line-2);border-radius:var(--r-m);margin-top:10px;
  background:radial-gradient(circle at 25% 10%,#eef2ff,#f4f6fa);overflow:hidden}
.cg-svg{display:block;width:100%;height:auto;font-family:var(--scp-font)}
.cg-node{cursor:pointer}
.cg-node rect{transition:.15s}
.cg-node:hover rect{stroke:var(--scp-accent);stroke-width:2.5}
.cg-legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--scp-text-2);border-top:1px solid var(--scp-line-2);background:var(--scp-surface)}
.cg-legend i{display:inline-block;width:22px;height:0;border-top-width:3px;border-top-style:solid;vertical-align:4px;margin-right:5px}
.cg-legend .dotc{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}

/* ── Gap-диаграмма покрытия ── */
.gap-chart{margin:14px 0}
.gap-row{display:flex;align-items:center;margin-bottom:8px;min-height:28px;gap:10px}
.gap-label{width:190px;font-size:11px;font-weight:600;flex-shrink:0;color:var(--scp-text-2)}
.gap-label.main{font-size:12px;font-weight:700;color:var(--scp-text)}
.gap-bar-bg{flex:1;height:28px;background:var(--scp-n-50);border:1px solid var(--scp-line-2);
  border-radius:var(--r-s);overflow:hidden;display:flex}
.gap-bar{height:100%;flex:0 0 auto}
.gap-bar-un{background-color:#fff5f6;background-image:repeating-linear-gradient(135deg,
  transparent 0 4px,rgba(255,0,23,.52) 4px 5px)}
.gap-val{width:170px;text-align:right;font-size:11px;font-weight:600;flex-shrink:0;line-height:1.35;font-variant-numeric:tabular-nums}
.gap-val.main{font-size:12px;font-weight:700}
.gap-val small{font-size:9.5px}
.gap-val .neg{color:var(--scp-err-tx);font-weight:700}
.gap-delta{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;vertical-align:middle}
.gap-delta.pos{background:var(--scp-ok-bg);color:var(--scp-ok-tx)}
.gap-delta.neg{background:var(--scp-err-bg);color:var(--scp-err-tx)}
.gap-divider{height:1px;background:var(--scp-line);margin:10px 0}
.gap-break{color:var(--scp-err-tx);font-size:14px}
.constr-grid{margin-top:6px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:8px;font-size:11px}

/* ── Карта цепочки поставок ── */
.supplymap{overflow-x:auto;border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  margin-top:8px;background:var(--scp-surface-2)}
.map-inner{position:relative;height:500px;min-width:1480px}
.map-row-label{position:absolute;left:10px;font-size:10px;font-weight:700;color:var(--scp-text-3);width:120px}
.map-node{position:absolute;width:70px;min-height:60px;background:var(--scp-surface);
  border:2px solid var(--scp-line-2);border-radius:var(--r-s);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:default;transition:transform .15s;z-index:2;padding:3px}
.map-node:hover{transform:scale(1.05);border-color:var(--scp-accent)}
.map-node .node-icon{font-size:18px;margin-bottom:2px}
.map-node .node-name{font-size:8px;color:var(--scp-text-3);text-align:center;line-height:1.2}
.map-node.restricted{border-color:var(--scp-err);background:#fff0f2}
.restriction-badge{position:absolute;top:-9px;right:-9px;background:var(--scp-err);color:#ffffff;
  padding:2px 4px;border-radius:var(--r-s);font-size:8px;font-weight:700}
.map-connection{position:absolute;height:2px;z-index:1;transform-origin:left center}
.map-connection.auto{background:var(--scp-warn)}
.map-connection.rail{background:var(--scp-accent)}
.map-connection.restricted{background:transparent;border-top:2px dashed var(--scp-err);height:0}

/* ── Сценарные карточки ── */
.scen{background:var(--scp-surface);border:1px solid var(--scp-line-2);
  border-left:4px solid var(--scp-text-3);border-radius:var(--r-m);padding:15px 17px;
  transition:.15s;position:relative;box-shadow:0 2px 8px rgba(4,20,58,.035)}
.scen:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(4,20,58,.08)}
.scen-a{border-left-color:var(--scp-accent)}
.scen-b{border-left-color:var(--scp-warn)}
.scen-c{border-left-color:var(--scp-ok)}
.scen.rec{background:linear-gradient(135deg,rgba(13,159,110,.09),#ffffff 62%);
  border-color:#9edec5;border-left-color:var(--scp-ok)}
.scen h4{font:700 15px/21px var(--scp-font);margin:0 0 6px;color:var(--scp-text);padding-right:30px}
.scen-rank{font-size:12px;font-weight:700;color:var(--scp-text-2);margin:0 0 8px;padding:4px 10px;
  background:var(--scp-n-50);border:1px solid var(--scp-line);border-radius:9999px;display:inline-block}
.scen-desc{font-size:13px;color:var(--scp-text-2);line-height:1.55;margin-bottom:10px}
.scen-metric{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;
  padding:4.5px 0;border-bottom:1px dashed var(--scp-line);font-variant-numeric:tabular-nums}
.scen-metric b{font-size:15px;font-weight:700;white-space:nowrap;color:var(--scp-text)}
.scen-metric b.green{color:var(--scp-ok-tx)}
.scen-metric b.orange{color:var(--scp-warn-tx)}
.scen-metric b.red{color:var(--scp-err-tx)}

/* ── Карточки моделей прогноза ── */
.model{background:var(--scp-surface);border:1px solid var(--scp-line-2);
  border-top:3px solid var(--scp-text-3);border-radius:var(--r-m);padding:13px}
.model.champ{border-top-color:var(--scp-accent);background:linear-gradient(135deg,rgba(71,105,255,.06),#ffffff 55%)}
.model h5{font:700 12px/17px var(--scp-font);margin:0 0 6px;color:var(--scp-text)}
.badge{background:var(--scp-accent);color:#ffffff;padding:2px 7px;border-radius:9999px;
  font-size:8.5px;font-weight:700;letter-spacing:.03em;vertical-align:1px}
.model .stat{font-size:11px;line-height:16px;color:var(--scp-text-2);margin-bottom:2px;display:block;text-align:left}
.model .stat.dim{color:var(--scp-text-3)}
.model canvas.chart{background:var(--scp-surface-2);border:1px solid var(--scp-line);
  border-radius:var(--r-s);margin:6px 0}

/* ── Сравнение сценариев: радар + выполнение годового плана ── */
.scen-split{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.15fr);gap:18px;align-items:start}
@media (max-width:980px){.scen-split{grid-template-columns:1fr}}
.scen-year{border:1px solid var(--scp-line-2);border-radius:var(--r-m);padding:13px 15px;background:var(--scp-surface);position:relative}
.scen-year > .chart-expand{top:9px}
.sy-head{font-size:13.5px;color:var(--scp-text-2);line-height:1.5;padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--scp-line);padding-right:30px}
.sy-head .muted{font-size:12.5px;margin-top:3px}
.sy-row{display:grid;grid-template-columns:1fr;gap:5px;padding:9px 11px;border-radius:9px;margin-bottom:7px;
  border:1px solid var(--scp-line);background:var(--scp-surface-2)}
.sy-row.sy-prev{background:var(--scp-n-50);opacity:.9}
.sy-row.sy-best{border:1.5px solid var(--scp-ok);background:rgba(13,159,110,.06)}
.sy-name{font-size:14px;font-weight:700;color:var(--scp-text);margin-bottom:2px}
.sy-m{display:grid;grid-template-columns:122px auto auto 1fr;align-items:center;gap:8px;font-size:13px;color:var(--scp-text-2)}
.sy-m b{font-variant-numeric:tabular-nums;color:var(--scp-text);white-space:nowrap}
.sy-k{color:var(--scp-text-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.sy-p{color:var(--scp-text-3);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sy-bar{display:block;height:7px;border-radius:4px;background:var(--scp-n-100);overflow:hidden;min-width:60px}
.sy-bar i{display:block;height:100%;border-radius:4px}
.sy-note{font-size:13px;color:var(--scp-text-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--scp-line)}

/* ── Тепловая карта ── */
.hm-scroll{overflow-x:auto;margin-top:12px;border-radius:var(--r-s);border:1px solid var(--scp-line-2)}
.hm{width:100%;min-width:900px;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.hm th,.hm td{padding:6px 8px;text-align:center;border:1px solid var(--scp-line)}
.hm th{background:var(--scp-n-50);color:var(--scp-text-3);font-size:9.5px;
  text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.hm th.row-header,.hm td.row-header{text-align:left;font-weight:600;color:var(--scp-text);
  position:sticky;left:0;background:var(--scp-surface);z-index:2;min-width:150px}
.hm th.row-header{background:var(--scp-n-50);z-index:3}
.hm .hm-total{background:var(--scp-n-900);color:#ffffff}
.hm-cell{font-weight:700;color:#ffffff;transition:transform .15s}
.hm-cell:hover{transform:scale(1.05);position:relative;z-index:1}
.hm-100{background:#08744f}.hm-90{background:#0d9f6e}.hm-80{background:#52c47e;color:#04143a}
.hm-70{background:#b5dc62;color:#04143a}.hm-60{background:#f5be30;color:#04143a}
.hm-50{background:#ff8c00;color:#ffffff}.hm-40{background:#f04822;color:#ffffff}.hm-30{background:#dc001b;color:#ffffff}
.hm-0{background:var(--scp-n-50);color:var(--scp-text-3)}
.hm-m-high{background:#08744f}.hm-m-good{background:#0d9f6e}.hm-m-mid{background:#52c47e;color:#04143a}
.hm-m-low{background:#b5dc62;color:#04143a}.hm-m-vlow{background:#f5be30;color:#04143a}
.hm-m-minimal{background:#ff8c00;color:#ffffff}.hm-m-loss{background:#dc001b;color:#ffffff}
.hm-m-na{background:var(--scp-n-50);color:var(--scp-text-3)}
.hm-delta-pos{background:#0d9f6e;color:#ffffff}
.hm-delta-neg{background:#ffd9df;color:#9e0012}
.hm-delta-zero{background:var(--scp-n-50);color:var(--scp-text-3)}
.hm-legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;
  font-size:11px;color:var(--scp-text-3)}
.hm-lg{display:inline-block;width:14px;height:14px;border-radius:3px;
  margin:0 4px 0 10px;vertical-align:-3px}
/* Итоговая строка тепловой карты: тёмно-синяя закреплённая подпись (#04143a), цветовая шкала сохраняется */
.hm tr.row-sum td.row-header,.hm tr.row-sum th.row-header{background:var(--scp-n-900)!important;color:#ffffff;
  font-weight:700;border-color:var(--scp-n-900);letter-spacing:.2px}
.hm tr.row-sum td{font-weight:700;border-top:2px solid var(--scp-n-900);border-bottom:2px solid var(--scp-n-900)}
.hm tr.row-sum td.hm-0,.hm tr.row-sum td.hm-m-na,.hm tr.row-sum td.hm-delta-zero{background:var(--scp-n-800);color:#ffffff}
.hm tr.row-sum td.wp-num,.hm tr.row-sum td.wp-mode{background:var(--scp-n-900);color:#ffffff}
.hm tr.row-sum td.wp-ok{background:#08744f;color:#ffffff}
.hm tr.row-sum td.wp-good{background:#52c47e;color:#04143a}
.hm tr.row-sum td.wp-mid{background:#f5be30;color:#04143a}
.hm tr.row-sum td.wp-bad{background:#ff8c00;color:#ffffff}
.hm tr.row-sum td.wp-worst{background:#dc001b;color:#ffffff}
.hm tr.row-sum td.hm-100{background:#08744f;color:#ffffff}
.hm tr.row-sum td.hm-90,.hm tr.row-sum td.hm-m-good,.hm tr.row-sum td.hm-delta-pos{background:#0d9f6e;color:#ffffff}
.hm tr.row-sum td.hm-80,.hm tr.row-sum td.hm-m-mid{background:#52c47e;color:#04143a}
.hm tr.row-sum td.hm-70,.hm tr.row-sum td.hm-m-low{background:#b5dc62;color:#04143a}
.hm tr.row-sum td.hm-60,.hm tr.row-sum td.hm-m-vlow{background:#f5be30;color:#04143a}
.hm tr.row-sum td.hm-50,.hm tr.row-sum td.hm-m-minimal{background:#ff8c00;color:#ffffff}
.hm tr.row-sum td.hm-40{background:#f04822;color:#ffffff}
.hm tr.row-sum td.hm-30,.hm tr.row-sum td.hm-m-loss{background:#dc001b;color:#ffffff}
.hm tr.row-sum td.hm-m-high{background:#08744f;color:#ffffff}
.hm tr.row-sum td.hm-delta-neg{background:#ffd9df;color:#9e0012}
/* тепловая карта точности прогноза (WAPE) */
.hm.wape{min-width:720px;font-size:12px}
.hm.wape th,.hm.wape td{padding:9px 10px}
.hm.wape td.row-header{min-width:190px}
.wp{font-weight:700;color:#ffffff;cursor:default}
.wp-ok{background:#08744f}.wp-good{background:#52c47e;color:#04143a}
.wp-mid{background:#f5be30;color:#04143a}.wp-bad{background:#ff8c00;color:#ffffff}
.wp-worst{background:#dc001b;color:#ffffff}
.wp-num{font-variant-numeric:tabular-nums;color:var(--scp-text-2);font-weight:600}
.wp-mode{text-align:left!important;color:var(--scp-text-3);font-weight:600;white-space:nowrap}

/* ── Действия / результаты ── */
.st-done{color:var(--scp-ok-tx);font-weight:700}
.st-progress{color:var(--scp-warn-tx);font-weight:700}
.st-pending{color:var(--scp-text-3);font-weight:600}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.result{border:1px solid var(--scp-line-2);border-radius:var(--r-m);padding:13px;text-align:center;
  background:var(--scp-surface-2)}
.result .result-v{font:700 19px/24px var(--scp-font);margin-top:4px;color:var(--scp-text);font-variant-numeric:tabular-nums}
.result-v.green{color:var(--scp-ok-tx)}
.result-v.orange{color:var(--scp-warn-tx)}

@media(max-width:1100px){
  .topbar{padding:0 12px}
  .grid{grid-template-columns:1fr}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  header,main,.ctxbar{padding-left:16px;padding-right:16px}
  h1{font-size:22px;line-height:28px}
}
@media(max-width:800px){
  .grid-3{grid-template-columns:1fr}
  main{padding:14px}
  .gap-label{width:120px}.gap-val{width:140px}
}
@media print{
  body{background:#ffffff}
  .topnav,.hdr-actions,.ctxbar{display:none}
  .card,.kpi{break-inside:avoid;border-color:var(--scp-n-300);box-shadow:none}
  .chart-expand,.fs-backdrop,.zoom-layer{display:none}
}
</style>
