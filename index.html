<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд ОППиУ | Лубри-Тех</title>
<script src="assets/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#122033;--muted:#64748b;--line:#dbe4ef;--accent:#20A7C9;--good:#137333;--warn:#B06000;--bad:#D93025}
[data-theme=dark]{--bg:#111827;--card:#1f2937;--text:#f8fafc;--muted:#94a3b8;--line:#374151}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:245px;padding:22px 14px;background:var(--card);border-right:1px solid var(--line);transition:.2s;flex-shrink:0}
.side.compact{width:76px}
.side.compact .label,.side.compact .brand small{display:none}
.brand{font-weight:800;font-size:17px;padding:0 10px 22px;color:var(--accent)}
nav button{display:block;width:100%;text-align:left;border:0;margin:3px 0;background:transparent;color:var(--muted)}
nav button.active,nav button:hover{background:rgba(32,167,201,.12);color:var(--accent)}
main{flex:1;padding:24px;max-width:1500px;margin:auto;min-width:0}
.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.top h1{margin:0 0 4px;font-size:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.context{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-left:3px solid var(--accent);padding:4px 9px;border-radius:6px}
.chip b{color:var(--text)}

/* ── KPI-карточки ── */
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:15px 17px;min-width:180px;flex:1;position:relative;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .value{font-size:25px;font-weight:750;margin-top:6px}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi-foot{font-size:10px;margin-top:5px}
.kpi-foot.red{color:var(--bad)}.kpi-foot.orange{color:var(--warn)}.kpi-foot.green{color:var(--good)}
.kpi .value.green{color:var(--good)}.kpi .value.orange{color:var(--warn)}.kpi .value.red{color:var(--bad)}.kpi .value.blue{color:var(--accent)}
.kpi.bt-red{border-top-color:var(--bad)}.kpi.bt-orange{border-top-color:#FF9800}.kpi.bt-green{border-top-color:#4CAF50}
.dev{font-size:10px;font-weight:600;margin-top:5px;padding:2px 7px;border-radius:5px;display:inline-block}
.dev-neg{background:rgba(217,48,37,.13);color:#D93025}
.dev-pos{background:rgba(19,115,51,.15);color:var(--good)}
.dev-neu{background:rgba(176,96,0,.13);color:var(--warn)}
.kpi .tooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1a2b4a;color:#fff;padding:7px 10px;border-radius:6px;font-size:11px;font-weight:400;text-align:center;z-index:30;width:max-content;max-width:230px;white-space:normal}
.kpi:hover .tooltip{display:block}

/* ── сетки и карточки ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;min-width:0}
.card h2{font-size:16px;margin:0 0 4px}
.card-sub{margin-bottom:8px}
.section-h{margin:6px 0 12px;font-size:15px}
canvas.chart{width:100%;display:block;margin-top:8px}
.insight{margin-top:10px;padding:10px 12px;background:rgba(32,167,201,.08);border-left:3px solid var(--accent);border-radius:6px;font-size:12px;line-height:1.55}
.info{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:12px;line-height:1.55;border:1px solid var(--line)}
.info-danger{background:rgba(217,48,37,.09);border-left:3px solid #D93025}
.info-warning{background:rgba(255,152,0,.10);border-left:3px solid #FF9800}
.info-success{background:rgba(19,115,51,.10);border-left:3px solid #4CAF50}
.info-primary{background:rgba(32,167,201,.08);border-left:3px solid var(--accent)}

/* ── переключатели ── */
.switch{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.switch button{font-size:11px;font-weight:600;color:var(--muted);padding:6px 12px}
.switch button.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── таблицы ── */
.toggle{margin-top:12px;background:var(--accent);border:0;color:#fff;font-size:11px;font-weight:600}
.tbl-wrap{display:none;margin-top:8px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tbl-wrap.show{display:block}
.tbl-scroll{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.dense{font-size:11px}
table.dense th{position:sticky;top:0;background:var(--card);z-index:2;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
table.dense td{padding:7px 9px}
table.dense tbody tr:hover{background:rgba(32,167,201,.06)}
tr.row-sum td{background:rgba(32,167,201,.09);font-weight:600}
tr.row-fc td{background:rgba(32,167,201,.05)}
tr.row-total td{background:rgba(19,115,51,.12);font-weight:700}
tr.dead td{background:rgba(217,48,37,.10)}
tr.dead td{color:var(--bad);font-weight:600}
.notice{padding:14px;border-left:4px solid #f59e0b;background:rgba(245,158,11,.10);border-radius:6px}

/* ── пузырьковая карта сегментации ── */
.bubblemap{position:relative;height:400px;border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
.zone{position:absolute;border:2px dashed;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:700}
.zone-strategic{border-color:#4CAF50;color:#4CAF50;background:rgba(76,175,80,.06);top:16px;left:16px;width:45%;height:46%}
.zone-core{border-color:#20A7C9;color:#20A7C9;background:rgba(32,167,201,.06);top:16px;right:16px;width:45%;height:46%}
.zone-perspective{border-color:#FF9800;color:#B06000;background:rgba(255,152,0,.06);bottom:16px;left:16px;width:45%;height:46%}
.zone-transactional{border-color:#D93025;color:#D93025;background:rgba(217,48,37,.06);bottom:16px;right:16px;width:45%;height:46%}
.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:700;color:#fff;cursor:default;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.18);line-height:1.25;padding:2px}
.bubble:hover{transform:scale(1.1);z-index:10}
.bubble-strategic{background:#4CAF50}.bubble-core{background:#20A7C9}.bubble-perspective{background:#FF9800}.bubble-transactional{background:#D93025}
.bubble-outlier{background:#9C27B0;border:3px solid #FFD700}

/* ── gap-диаграмма покрытия ── */
.gap-chart{margin:14px 0}
.gap-row{display:flex;align-items:center;margin-bottom:8px;min-height:28px;gap:10px}
.gap-label{width:190px;font-size:11px;font-weight:600;flex-shrink:0}
.gap-label.main{font-size:12px;font-weight:750}
.gap-bar-bg{flex:1;height:28px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.gap-bar{height:100%}
.gap-val{width:150px;text-align:right;font-size:11px;font-weight:600;flex-shrink:0}
.gap-val.main{font-size:12px;font-weight:750}
.gap-val small{font-size:9px}
.gap-divider{height:1px;background:var(--line);margin:10px 0}
.gap-break{color:var(--bad);font-size:14px}
.constr-grid{margin-top:6px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;font-size:11px}

/* ── карта цепочки поставок ── */
.supplymap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.map-inner{position:relative;height:500px;min-width:1480px}
.map-row-label{position:absolute;left:10px;font-size:10px;font-weight:700;color:var(--muted);width:120px}
.map-node{position:absolute;width:70px;min-height:60px;background:var(--card);border:2px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;transition:transform .15s;z-index:2;padding:3px}
.map-node:hover{transform:scale(1.05)}
.map-node .node-icon{font-size:18px;margin-bottom:2px}
.map-node .node-name{font-size:8px;color:var(--muted);text-align:center;line-height:1.2}
.map-node.restricted{border-color:#D93025;background:rgba(217,48,37,.10)}
.restriction-badge{position:absolute;top:-9px;right:-9px;background:#D93025;color:#fff;padding:2px 4px;border-radius:4px;font-size:8px;font-weight:700}
.map-connection{position:absolute;height:2px;z-index:1;transform-origin:left center}
.map-connection.auto{background:#FF9800}
.map-connection.rail{background:#20A7C9}
.map-connection.restricted{background:transparent;border-top:2px dashed #D93025;height:0}

/* ── сценарные карточки ── */
.scen{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;padding:15px;transition:transform .15s}
.scen:hover{transform:translateY(-2px)}
.scen-a{border-left-color:#20A7C9}.scen-b{border-left-color:#FF9800}.scen-c{border-left-color:#4CAF50}
.scen.rec{background:linear-gradient(135deg,rgba(76,175,80,.12),transparent 60%);border-color:#4CAF50;border-left-color:#4CAF50}
.scen h4{font-size:14px;margin:0 0 10px}
.scen-desc{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:10px}
.scen-metric{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.scen-metric b{font-size:14px;white-space:nowrap}
.scen-metric b.green{color:var(--good)}.scen-metric b.orange{color:var(--warn)}.scen-metric b.red{color:var(--bad)}

/* ── карточки моделей прогноза ── */
.model{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--muted);border-radius:10px;padding:12px}
.model.champ{border-top-color:#4CAF50;background:linear-gradient(135deg,rgba(76,175,80,.08),transparent 55%)}
.model h5{font-size:11px;margin:0 0 6px}
.badge{background:#4CAF50;color:#fff;padding:2px 6px;border-radius:4px;font-size:8px;font-weight:700}
.model .stat{font-size:10px;color:var(--muted);margin-bottom:2px}
.model .stat.dim{opacity:.75}
.model canvas.chart{background:rgba(127,140,160,.08);border:1px solid var(--line);border-radius:6px;margin:6px 0}

/* ── тепловая карта ── */
.hm-scroll{overflow-x:auto;margin-top:12px}
.hm{width:100%;min-width:900px;border-collapse:collapse;font-size:11px}
.hm th,.hm td{padding:6px 8px;text-align:center;border:1px solid var(--line)}
.hm th{background:var(--bg);color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
.hm th.row-header,.hm td.row-header{text-align:left;font-weight:600;color:var(--text);position:sticky;left:0;background:var(--card);z-index:2;min-width:150px}
.hm th.row-header{background:var(--bg);z-index:3}
.hm .hm-total{background:#1a2b4a;color:#fff}
[data-theme=dark] .hm .hm-total{background:#0d1526}
.hm-cell{font-weight:600;color:#fff;transition:transform .15s}
.hm-cell:hover{transform:scale(1.05);position:relative;z-index:1}
.hm-100{background:#137333}.hm-90{background:#4CAF50}.hm-80{background:#8BC34A}.hm-70{background:#CDDC39;color:#1a2b4a}.hm-60{background:#FFC107;color:#1a2b4a}.hm-50{background:#FF9800}.hm-40{background:#FF5722}.hm-30{background:#D93025}.hm-0{background:var(--bg);color:var(--muted)}
.hm-m-high{background:#137333}.hm-m-good{background:#4CAF50}.hm-m-mid{background:#8BC34A}.hm-m-low{background:#CDDC39;color:#1a2b4a}.hm-m-vlow{background:#FFC107;color:#1a2b4a}.hm-m-minimal{background:#FF9800}.hm-m-loss{background:#D93025}.hm-m-na{background:var(--bg);color:var(--muted)}
.hm-delta-pos{background:#4CAF50}
.hm-delta-neg{background:#FFCDD2;color:#B3241e}
[data-theme=dark] .hm-delta-neg{background:rgba(217,48,37,.45);color:#ffb3ab}
.hm-delta-neg-good{border:2px solid #4CAF50}
.hm-delta-zero{background:var(--bg);color:var(--muted)}
.hm-legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.hm-lg{display:inline-block;width:14px;height:14px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-3px}
.hm tr.row-sum td.row-header{background:var(--bg)}

/* ── действия / результаты ── */
.st-done{color:var(--good);font-weight:600}.st-progress{color:var(--warn);font-weight:600}.st-pending{color:var(--muted);font-weight:600}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.result{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.result .result-v{font-size:20px;font-weight:700;margin-top:4px}
.result-v.green{color:var(--good)}.result-v.orange{color:var(--warn)}
.decision{margin-top:16px}

@media(max-width:1100px){.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.side{width:76px}.side .label,.side .brand small{display:none}.grid,.grid-3{grid-template-columns:1fr}main{padding:15px}.top{flex-direction:column}.gap-label{width:120px}.gap-val{width:110px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
