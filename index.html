<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Центр аналитики</title><script src="assets/xlsx.full.min.js"></script><style>:root{--bg:#f4f7fb;--card:#fff;--text:#122033;--muted:#64748b;--line:#dbe4ef;--accent:#2563eb} [data-theme=dark]{--bg:#111827;--card:#1f2937;--text:#f8fafc;--muted:#94a3b8;--line:#374151}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;padding:22px 14px;background:var(--card);border-right:1px solid var(--line);transition:.2s}.side.compact{width:76px}.side.compact .label,.side.compact .brand small{display:none}.brand{font-weight:800;font-size:18px;padding:0 10px 22px;color:var(--accent)}nav button{display:block;width:100%;text-align:left;border:0;margin:3px 0;background:transparent;color:var(--muted)}nav button.active,nav button:hover{background:#e8f0ff;color:var(--accent)}main{flex:1;padding:24px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.filters,.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.filter{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;min-width:190px;flex:1}.kpi .value{font-size:26px;font-weight:750;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.card h2{font-size:16px;margin:0 0 4px}.muted{color:var(--muted)}canvas{width:100%;height:280px;display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.notice{padding:14px;border-left:4px solid #f59e0b;background:#fff7ed;color:var(--text);border-radius:6px}@media(max-width:800px){.side{width:76px}.side .label,.side .brand small{display:none}.grid{grid-template-columns:1fr}main{padding:15px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><script type="module" src="src/app.js"></script></body></html>
